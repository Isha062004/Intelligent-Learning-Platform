version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: learning_platform_db
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learning_platform_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/learning_platform
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - postgres
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/faiss_store:/app/faiss_store

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learning_platform_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
